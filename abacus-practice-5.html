<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abacus Sum Practice</title>
<style>
:root{
  --bg:#F5F3FF; --panel:#FFFFFF; --frame:#6D28D9; --rail:#F59E0B;
  --ink:#241B3D; --sub:#6B5E8C; --bead:#EC4899; --bead2:#059669;
  --line:#E4DAFC; --shadow:0 2px 8px rgba(109,40,217,.12);
  --grad:linear-gradient(135deg,#7C3AED,#EC4899 50%,#F59E0B);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1530; --panel:#251E40; --frame:#A78BFA; --rail:#FBBF24;
    --ink:#F0EBFF; --sub:#B7ABDA; --bead:#F472B6; --bead2:#34D399;
    --line:#3A3160; --shadow:0 2px 8px rgba(0,0,0,.4);
    --grad:linear-gradient(135deg,#4C1D95,#831843 50%,#78350F);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1530; --panel:#251E40; --frame:#A78BFA; --rail:#FBBF24;
  --ink:#F0EBFF; --sub:#B7ABDA; --bead:#F472B6; --bead2:#34D399;
  --line:#3A3160; --shadow:0 2px 8px rgba(0,0,0,.4);
  --grad:linear-gradient(135deg,#4C1D95,#831843 50%,#78350F);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Segoe UI',ui-sans-serif,system-ui,sans-serif;
  height:100%; display:flex; flex-direction:column;
}
header{
  padding:16px 16px; background:var(--grad); color:#fff;
  display:flex; align-items:center; gap:14px;
}
.logo{ height:56px; width:56px; border-radius:50%; background:#fff; flex-shrink:0;
  object-fit:cover; box-shadow:0 2px 8px rgba(0,0,0,.3); }
h1{
  margin:0 0 2px; font-size:1.4rem; letter-spacing:.2px; color:#fff;
  font-family:Georgia,'Noto Serif',serif;
}
header .sub{color:rgba(255,255,255,.9); font-size:.85rem; margin:0;}
.levels{
  display:flex; flex-wrap:wrap; gap:7px; padding:12px 16px; background:var(--panel);
}
.lvl-btn{
  border:1.5px solid var(--line); background:transparent; color:var(--ink);
  padding:6px 12px; border-radius:20px; font-size:.85rem; cursor:pointer;
  transition:transform .1s;
}
.lvl-btn:nth-child(1){ border-color:#EC4899; color:#EC4899; }
.lvl-btn:nth-child(2){ border-color:#F59E0B; color:#B45309; }
.lvl-btn:nth-child(3){ border-color:#10B981; color:#047857; }
.lvl-btn:nth-child(4){ border-color:#06B6D4; color:#0E7490; }
.lvl-btn:nth-child(5){ border-color:#6366F1; color:#4338CA; }
.lvl-btn:nth-child(6){ border-color:#8B5CF6; color:#6D28D9; }
.lvl-btn:nth-child(7){ border-color:#F43F5E; color:#BE123C; }
.lvl-btn:nth-child(8){ border-color:#EA580C; color:#C2410C; }
.lvl-btn.active{ background:var(--frame); border-color:var(--frame); color:#fff; }
.lvl-name{ padding:2px 16px 10px; color:var(--sub); font-size:.85rem; }
.ops{
  display:flex; flex-wrap:wrap; gap:7px; padding:0 16px 12px; background:var(--panel);
}
.op-btn{
  border:1.5px solid var(--line); background:transparent; color:var(--ink);
  padding:6px 13px; border-radius:20px; font-size:.85rem; cursor:pointer; font-weight:600;
}
.op-btn.active{ background:var(--bead2); border-color:var(--bead2); color:#fff; }
.digits{
  display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:0 16px 12px; background:var(--panel);
}
.digits-label{ color:var(--sub); font-size:.85rem; font-weight:600; margin-right:2px; }
.digit-btn{
  border:1.5px solid var(--line); background:transparent; color:var(--ink);
  padding:5px 11px; border-radius:20px; font-size:.85rem; cursor:pointer; font-weight:600;
}
.digit-btn.active{ background:var(--frame); border-color:var(--frame); color:#fff; }
.timer{
  font-family:Consolas,'SFMono-Regular',monospace; font-weight:700; font-size:1.15rem;
  background:var(--panel); border:2px solid var(--frame); color:var(--frame);
  padding:7px 14px; border-radius:8px; align-self:center;
}
.timer.stopped{ border-color:var(--bead2); color:var(--bead2); }
.toolbar{ display:flex; gap:8px; padding:0 16px 14px; }
.btn{
  border:none; background:var(--bead); color:#fff; padding:9px 16px;
  border-radius:8px; font-size:.9rem; cursor:pointer; box-shadow:var(--shadow);
}
.btn.secondary{ background:transparent; color:var(--frame); border:1.5px solid var(--frame); box-shadow:none; }
main{ padding:6px 12px 24px; max-width:1400px; margin:0 auto; width:100%; flex:1; min-height:0; }
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:10px; height:100%;
}
@media (min-width:900px){
  .grid{ grid-template-columns:repeat(5,1fr); }
}
body.fs header .sub, body.fs .lvl-name, body.fs footer{ display:none; }
body.fs header{ padding:8px 16px; }
body.fs .levels, body.fs .ops{ padding:6px 16px; }
body.fs .toolbar{ padding:0 16px 8px; }
body.fs main{ padding:4px 12px 8px; overflow:hidden; }
body.fs .grid{
  grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(4,1fr);
  height:100%; gap:8px;
}
body.fs .card{ display:flex; flex-direction:column; justify-content:center; }
.card{
  background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--frame);
  border-radius:8px; padding:8px 6px 10px; text-align:center; cursor:pointer;
  box-shadow:var(--shadow); user-select:none;
}
.idx{ font-size:.72rem; color:var(--sub); margin-bottom:4px; }
.rows{
  font-variant-numeric:tabular-nums; font-family:Consolas,'SFMono-Regular',monospace;
  font-size:.95rem; line-height:1.35; border-bottom:2px solid var(--rail);
  padding-bottom:4px; margin-bottom:6px; min-height:1.35em;
}
.ans{
  font-family:Consolas,'SFMono-Regular',monospace; font-weight:700; font-size:1.05rem;
  color:var(--bead2); min-height:1.3em;
}
.ans.hidden{ color:var(--sub); opacity:.45; }
footer{ text-align:center; color:var(--sub); font-size:.75rem; padding:10px 0 20px; }
</style>
</head>

  <div>
    <h1>Abacus Sum Practice</h1>
    <p class="sub">Choose a level and operation types, get 20 sums — click any sum to reveal its answer</p>
  </div>
</header>
<div class="levels" id="levels"></div>
<div class="lvl-name" id="lvlName"></div>
<div class="ops" id="ops"></div>
<div class="digits" id="digits"></div>
<div class="toolbar">
  <button class="btn" onclick="regenerate()">New Sums</button>
  <button class="btn secondary" onclick="toggleAll()">Show / Hide All Answers</button>
  <button class="btn" id="fsBtn" onclick="toggleFullscreen()">Full Screen</button>
  <span class="timer" id="timerDisplay">00:00</span>
</div>
<main><div class="grid" id="grid"></div></main>
<footer>Click any sum to reveal its answer · Levels 1–8</footer>

<script>
const LEVELS = [
 {n:1, rows:4, digits:1, mode:'direct', sub:false, name:'Direct Addition/Subtraction (no formula, earth & heaven beads only)'},
 {n:2, rows:4, digits:1, mode:'small',  sub:true,  name:'Small Friend Formula (Friends of 5)'},
 {n:3, rows:4, digits:1, mode:'big',    sub:true,  name:'Big Friend Formula (Friends of 10)'},
 {n:4, rows:5, digits:1, mode:'mix',    sub:true,  name:'Small + Big Friend Combination (mental visualization begins)'},
 {n:5, rows:5, digits:2, mode:'mix',    sub:true,  name:'2-Digit Mixed Practice, more rows'},
 {n:6, rows:6, digits:2, mode:'mix',    sub:true,  name:'2-Digit Advanced, timed practice'},
 {n:7, rows:6, digits:3, mode:'mix',    sub:true,  name:'3-Digit Mixed Practice'},
 {n:8, rows:7, digits:3, mode:'mix',    sub:true,  name:'3-Digit Advanced — full curriculum recap'}
];
let currentLevel = 1;
let revealedAll = false;
let timerInterval = null;
let timerSeconds = 0;
let revealedCount = 0;

function updateTimerDisplay(){
  const m = String(Math.floor(timerSeconds/60)).padStart(2,'0');
  const s = String(timerSeconds%60).padStart(2,'0');
  document.getElementById('timerDisplay').textContent = m+':'+s;
}
function startTimer(){
  clearInterval(timerInterval);
  timerSeconds = 0;
  revealedCount = 0;
  updateTimerDisplay();
  document.getElementById('timerDisplay').classList.remove('stopped');
  timerInterval = setInterval(()=>{
    timerSeconds++;
    updateTimerDisplay();
  },1000);
}
function stopTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById('timerDisplay').classList.add('stopped');
}
const OPS = [
 {id:'add', label:'+ Addition'},
 {id:'sub', label:'− Subtraction'},
 {id:'mul', label:'× Multiplication'},
 {id:'div', label:'÷ Division'},
 {id:'dec', label:'. Decimal'}
];
let activeOps = new Set(['add','sub']);
const DIGIT_CHOICES = ['auto',1,2,3,4,5,6,7,8];
let selectedDigits = 'auto';

function toggleDigit(d){
  selectedDigits = d;
  regenerate();
}

function renderDigits(){
  const wrap = document.getElementById('digits');
  wrap.innerHTML = '';
  const label = document.createElement('span');
  label.className = 'digits-label';
  label.textContent = 'Digits:';
  wrap.appendChild(label);
  DIGIT_CHOICES.forEach(d=>{
    const b = document.createElement('button');
    b.className = 'digit-btn' + (selectedDigits===d?' active':'');
    b.textContent = d==='auto' ? 'Auto (Level)' : d;
    b.onclick = ()=> toggleDigit(d);
    wrap.appendChild(b);
  });
}

function toggleOp(id){
  if(activeOps.has(id)){
    if(activeOps.size>1) activeOps.delete(id);
  } else {
    activeOps.add(id);
  }
  regenerate();
}

function renderOps(){
  const wrap = document.getElementById('ops');
  wrap.innerHTML = '';
  OPS.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'op-btn' + (activeOps.has(o.id)?' active':'');
    b.textContent = o.label;
    b.onclick = ()=> toggleOp(o.id);
    wrap.appendChild(b);
  });
}

function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

function classifyOp(cvUnits, d, isAdd){
  if(isAdd){
    const s = cvUnits + (d%10);
    if(s > 9) return 'big';
    if((cvUnits%5) + (d%5) > 4) return 'small';
    return 'direct';
  } else {
    if((d%10) > cvUnits) return 'big';
    if((cvUnits%5) < (d%5)) return 'small';
    return 'direct';
  }
}

function modeAllows(mode, cls){
  if(mode==='direct') return cls==='direct';
  if(mode==='small')  return cls==='small';
  if(mode==='big')    return cls==='big';
  return true; // mix: small + big + direct combined
}

function pickOpType(){
  const arr = Array.from(activeOps);
  return arr[randInt(0,arr.length-1)];
}

function genAddSub(cfg, forceSign, isDecimal){
  const scale = isDecimal ? 10 : 1;
  const dMin = (cfg.digits===1 ? 1 : Math.pow(10,cfg.digits-1)) * scale;
  const dMax = Math.pow(10,cfg.digits) * scale - 1;
  const fmt = v => isDecimal ? (v/10).toFixed(1) : String(v);
  let first = randInt(dMin,dMax);
  let rows = [first];
  let total = first;
  const rowCount = forceSign==='sub' ? Math.min(cfg.rows,4) : cfg.rows;
  for(let i=1;i<rowCount;i++){
    let isAdd = true;
    if(forceSign==='sub') isAdd = false;
    else if(forceSign==='add') isAdd = true;
    else if(cfg.sub && total>0 && Math.random()<0.5) isAdd = false;
    let chosen = null;
    for(let tries=0; tries<60 && chosen===null; tries++){
      let d = randInt(dMin,dMax);
      if(!isAdd && d>total) continue;
      if(cfg.digits===1 && !isDecimal){
        const cls = classifyOp(total%10, d, isAdd);
        if(!modeAllows(cfg.mode, cls)) continue;
      }
      chosen = d;
    }
    if(chosen===null) chosen = Math.min(dMin,total);
    rows.push(isAdd?chosen:-chosen);
    total += isAdd?chosen:-chosen;
  }
  const display = rows.map((r,idx)=>{
    const v = fmt(Math.abs(r));
    if(idx===0) return v;
    return (r<0?'- ':'+ ') + v;
  });
  return {display, total: isDecimal ? (total/10).toFixed(1) : total};
}

function genMul(cfg){
  const aDigits = cfg.digits;
  const bDigits = cfg.n<=4 ? 1 : 2;
  const aMin = aDigits===1?1:Math.pow(10,aDigits-1), aMax=Math.pow(10,aDigits)-1;
  const bMin = bDigits===1?1:Math.pow(10,bDigits-1), bMax=Math.pow(10,bDigits)-1;
  const a = randInt(aMin,aMax), b = randInt(bMin,bMax);
  return {display:[String(a), '× '+b], total:a*b};
}

function genDiv(cfg){
  const bDigits = cfg.n<=4 ? 1 : 2;
  const qDigits = cfg.digits;
  const bMin = bDigits===1?1:Math.pow(10,bDigits-1), bMax=Math.pow(10,bDigits)-1;
  const qMin = qDigits===1?1:Math.pow(10,qDigits-1), qMax=Math.pow(10,qDigits)-1;
  const b = randInt(bMin,bMax), q = randInt(qMin,qMax);
  return {display:[String(b*q), '÷ '+b], total:q};
}

function genProblem(cfg){
  const type = pickOpType();
  if(type==='mul') return genMul(cfg);
  if(type==='div') return genDiv(cfg);
  if(type==='dec') return genAddSub(cfg, null, true);
  return genAddSub(cfg, type, false); // 'add' or 'sub'
}

function renderLevels(){
  const wrap = document.getElementById('levels');
  wrap.innerHTML = '';
  LEVELS.forEach(l=>{
    const b = document.createElement('button');
    b.className = 'lvl-btn' + (l.n===currentLevel?' active':'');
    b.textContent = 'Level ' + l.n;
    b.onclick = ()=>{ currentLevel = l.n; regenerate(); };
    wrap.appendChild(b);
  });
  document.getElementById('lvlName').textContent =
    LEVELS.find(l=>l.n===currentLevel).name;
}

function regenerate(){
  revealedAll = false;
  renderLevels();
  renderOps();
  renderDigits();
  const cfg = LEVELS.find(l=>l.n===currentLevel);
  const effCfg = Object.assign({}, cfg);
  if(selectedDigits!=='auto') effCfg.digits = selectedDigits;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for(let i=1;i<=20;i++){
    const p = genProblem(effCfg);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="idx">'+i+'</div>'+
      '<div class="rows">'+p.display.join('<br>')+'</div>'+
      '<div class="ans hidden">?</div>';
    const ansEl = card.querySelector('.ans');
    ansEl.dataset.answer = p.total;
    card.onclick = ()=>{
      if(ansEl.classList.contains('hidden')){
        ansEl.textContent = ansEl.dataset.answer;
        ansEl.classList.remove('hidden');
        if(!card.dataset.revealedOnce){
          card.dataset.revealedOnce = '1';
          revealedCount++;
          if(revealedCount>=20) stopTimer();
        }
      } else {
        ansEl.textContent = '?';
        ansEl.classList.add('hidden');
      }
    };
    grid.appendChild(card);
  }
  startTimer();
}

function toggleAll(){
  revealedAll = !revealedAll;
  document.querySelectorAll('.card').forEach(card=>{
    const el = card.querySelector('.ans');
    if(revealedAll){
      el.textContent = el.dataset.answer;
      el.classList.remove('hidden');
      card.dataset.revealedOnce = '1';
    } else {
      el.textContent = '?';
      el.classList.add('hidden');
    }
  });
  if(revealedAll){
    revealedCount = 20;
    stopTimer();
  }
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', ()=>{
  const on = !!document.fullscreenElement;
  document.body.classList.toggle('fs', on);
  const btn = document.getElementById('fsBtn');
  if(btn) btn.textContent = on ? 'Exit Full Screen' : 'Full Screen';
});

regenerate();
</script>
</body>
</html>
